name: release-59609

# Builds comctl32 (and comctl32_v6 where Wine has it) with the fix for WineHQ bug 59609
# for several Wine tags, clears the builtin mark, and publishes the files in the GitHub
# release "fix-59609" together with the patch, the source commits and SHA256SUMS.
# Start: push the tag fix-59609, or run it by hand with a list of Wine tags.

on:
  push:
    tags: ['fix-59609']
  workflow_dispatch:
    inputs:
      tags:
        description: 'Wine tags to build, space-separated (empty: wine-9.0, wine-11.0 and the latest wine-11.x)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git gcc make flex bison gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
      - name: Choose Wine tags
        id: tags
        run: |
          t="${{ inputs.tags }}"
          if [ -z "$t" ]; then
            devel=$(git ls-remote --tags https://github.com/wine-mirror/wine.git 'wine-11.*' \
                    | sed -n 's#.*refs/tags/\(wine-11\.[0-9]*\)$#\1#p' | sort -V | tail -n 1)
            t="wine-9.0 wine-11.0 $devel"
          fi
          echo "tags=$t" >> "$GITHUB_OUTPUT"
          echo "Wine tags: $t"
      - name: Build with the fix
        run: |
          set -euo pipefail
          export FIW_WORK="$RUNNER_TEMP/fiw" FIW_WINE_GIT=https://github.com/wine-mirror/wine.git
          mkdir -p out
          for tag in ${{ steps.tags.outputs.tags }}; do
            src="$FIW_WORK/src/$tag"
            git clone -q --depth 1 --branch "$tag" "$FIW_WINE_GIT" "$src"
            git -C "$src" apply showcases/59609/fix.patch
            mods=comctl32; [ -d "$src/dlls/comctl32_v6" ] && mods="comctl32 comctl32_v6"
            bash tools/build_one_dll.sh "$tag" $mods > built.txt
            while read -r f; do
              mod=$(basename "$(dirname "$(dirname "$f")")")
              arch=$(basename "$(dirname "$f")"); arch=${arch%-windows}
              python3 tools/pe_unmark.py "$f" "out/$mod-$tag-$arch.dll"
            done < built.txt
            echo "$tag $(git -C "$src" rev-parse HEAD) + fix.patch" >> out/SOURCE.txt
          done
          cp showcases/59609/fix.patch out/
          (cd out && sha256sum *.dll > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=fix-59609
          if ! gh release view "$rel" >/dev/null 2>&1; then
            cat > notes.md <<'EOF'
          comctl32 with the fix for [WineHQ bug 59609](https://bugs.winehq.org/show_bug.cgi?id=59609)
          (FastStone Image Viewer's thumbnail strip), one file per Wine version and architecture.
          The builtin mark is cleared, so Wine loads the file as native.

          Apply it to FastStone only, with one command: see
          [showcases/59609](https://github.com/unxed/fix-it-in-wine/tree/main/showcases/59609) (`apply.sh`).

          Source (LGPL-2.1-or-later): the Wine commits in SOURCE.txt plus fix.patch.
          Evidence: the showcase-59609 workflow (Windows, Wine with the builtin comctl32, Wine with this one).
          EOF
            sed -i 's/^          //' notes.md
            gh release create "$rel" --title "Fix for WineHQ bug 59609 (comctl32)" --notes-file notes.md
          fi
          gh release upload "$rel" out/* --clobber
